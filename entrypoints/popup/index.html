<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download Organization</title>
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <img
          class="hero__logo"
          src="logo.png"
          width="36"
          height="36"
          alt=""
          decoding="async"
        />
        <h1 class="hero__title">Download Organization</h1>
      </header>

      <div class="sr-only" id="status-banner" role="status" aria-live="polite">
        <strong class="status__label" id="status-label">Classement automatique</strong>
        <span id="status-detail-sr"></span>
      </div>

      <section class="card" aria-labelledby="toggle-heading">
        <h2 class="sr-only" id="toggle-heading">Activer ou désactiver le classement</h2>
        <label class="toggle-row">
          <span class="toggle-row__text">
            <span class="toggle-row__title">
              <span class="status__dot" id="status-dot" aria-hidden="true"></span>
              Ranger chaque téléchargement
            </span>
            <span class="toggle-row__desc" id="status-detail">
              Sous-dossiers du dossier « Téléchargements » du navigateur (Images, Vidéos, etc.).
            </span>
          </span>
          <span class="switch" title="Activer ou désactiver">
            <input type="checkbox" id="sort-enabled" aria-describedby="folders-hint" />
            <span class="switch__ui" aria-hidden="true">
              <span class="switch__knob"></span>
            </span>
          </span>
        </label>
      </section>

      <button type="button" class="open-panel" id="open-organizer">
        Trier les fichiers
      </button>

      <button type="button" class="open-panel open-panel--secondary" id="grant-folder">
        Ajouter un dossier
      </button>

      <section class="folders" id="folders-hint" aria-label="Dossiers utilisés quand le classement est actif">
        <p class="folders__title">Dossiers créés</p>
        <ul class="folders__list">
          <li><span class="folders__tag">Images</span></li>
          <li><span class="folders__tag">Vidéos</span></li>
          <li><span class="folders__tag">Audios</span></li>
          <li><span class="folders__tag">Documents</span></li>
          <li><span class="folders__tag">Autres</span></li>
        </ul>
      </section>

      <p class="footnote">
        Enregistré sur cet appareil. Désactivé : le dossier habituel, sans sous-dossiers.
      </p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
