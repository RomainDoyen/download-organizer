<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajouter un dossier</title>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="logo.png" width="40" height="40" alt="" />
      <h1>Ajouter un dossier</h1>
      <p>
        Choisissez un dossier (souvent <strong>Téléchargements</strong>). Vous pouvez en
        ajouter d’autres ensuite : Bureau, Documents, un disque externe… Chaque racine
        et ses sous-dossiers sont listés.
      </p>
      <button type="button" class="cta" id="pick-folder">Ajouter un dossier</button>
      <p class="status" id="status" role="status"></p>
      <p class="help" id="browser-help" hidden></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
