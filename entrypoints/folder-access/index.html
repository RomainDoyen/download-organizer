<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajouter un dossier</title>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="logo.png" width="40" height="40" alt="" />
      <h1>Ajouter un dossier</h1>
      <p id="intro">
        Pour un accès permanent, ouvrez le dossier puis validez un <strong>sous-dossier</strong>.
        Chrome refuse Téléchargements, le Bureau, Documents et le dossier personnel.
      </p>
      <button type="button" class="cta" id="pick-folder">Ajouter un sous-dossier</button>
      <button type="button" class="cta cta--secondary" id="pick-folder-classic">Lire un dossier entier</button>
      <p class="status" id="status" role="status"></p>
      <p class="help" id="browser-help" hidden></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
